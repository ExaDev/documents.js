name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec attw --pack

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      # Cloudflare Workers (workerd) runtime test -- pnpm install above already built the workerd binary (allowBuilds in pnpm-workspace.yaml), enforcing zero Node-only API usage on the tested paths at runtime.
      - run: pnpm test:workers
      - name: Upload coverage report
        # GitHub Code Quality requires the org on Team/Enterprise Cloud (ExaDev is currently Free), so this no-ops until the org upgrades -- fail-on-error: false keeps that from blocking release, which depends on this job succeeding.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: typescript
          label: unit
          fail-on-error: false

  test-smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:smoke

  release:
    name: Release
    needs: [commitlint, lint, typecheck, test, test-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to push the release commit/tag and create the GitHub Release
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
      id-token: write # OIDC identity for npm trusted publishing (no NPM_TOKEN)
    outputs:
      published: ${{ steps.before.outputs.version != steps.after.outputs.version }}
      version: ${{ steps.after.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release analyses the full commit history since the last release.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          # registry-url is deliberately absent. Setting it makes setup-node write an .npmrc containing an _authToken line, and that line wins over the OIDC token exchange -- so the setting that looks like it configures the registry is exactly the one that would stop trusted publishing working.
      - run: pnpm install --frozen-lockfile
      - name: Read pre-release version
        id: before
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Upgrade npm for OIDC trusted publishing (needs npm CLI >=11.5.1)
        run: npm install -g npm@latest
      - name: Release
        # HUSKY=0 so the commit-msg hook never fires against the automated release commit.
        run: HUSKY=0 pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Blanked, not omitted -- an inherited NPM_TOKEN/NODE_AUTH_TOKEN from a workflow-level env block, reusable workflow, or composite action would otherwise be used in preference to the OIDC exchange.
          NPM_TOKEN: ''
          NODE_AUTH_TOKEN: ''
      - name: Read post-release version
        id: after
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  notify-downstream:
    name: Notify downstream repositories
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Generate a token for cross-repo dispatch
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: '4473709'
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          repositories: |
            document-cli
            documents
            document-mcp
      - name: Dispatch sibling-released event to downstream repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version="${{ needs.release.outputs.version }}"
          for repo in documents document-cli document-mcp; do
            gh api "repos/ExaDev/$repo/dispatches" \
              -f event_type=sibling-released \
              -F "client_payload[package]=documents.js" \
              -F "client_payload[version]=$version"
          done

  publish-aliases:
    name: Publish aliases (${{ matrix.name }})
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC identity for npm trusted publishing -- the GitHub Packages alias stays its own separate job (see that job's own permissions comment) specifically so it never holds this permission.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: js.documents, registry: 'https://registry.npmjs.org' }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # the release commit semantic-release just pushed
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          # registry-url is deliberately absent. Setting it makes setup-node write an .npmrc containing an _authToken line, and that line wins over the OIDC exchange -- so the setting that looks like it configures the registry is exactly the one that would break trusted publishing.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Rewrite package name for this alias
        run: npm pkg set name="${{ matrix.name }}"
      - run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: '' # Blanked, not omitted -- an inherited NODE_AUTH_TOKEN would otherwise be used in preference to the OIDC exchange.

  publish-github-packages:
    name: Publish alias to GitHub Packages
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # Deliberately no id-token: write here -- see publish-aliases' own comment above for why this job is kept separate: pnpm attempts an OIDC exchange whenever id-token: write is available regardless of target registry, and GitHub Packages has no such exchange to attempt, which would then break its fallback to the GITHUB_TOKEN this job actually authenticates with.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # the release commit semantic-release just pushed
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          # Deliberately NOT setup-node's own registry-url/scope inputs (tried first, see ExaDev/documents.js#309): those write an @exadev:registry=https://npm.pkg.github.com/ *install-time* scope-to-registry mapping into .npmrc, and per setup-node's own docs an empty/omitted `scope` still falls back to the repository owner (ExaDev) when the target is GitHub Packages -- there is no way to get just the auth-token line out of that mechanism without also redirecting every @exadev-scoped *install* through it. That broke `pnpm install` below: @exadev/eslint-config is a real devDependency published only to the default registry, never mirrored to GitHub Packages, so the redirected fetch 404'd once the auth header was fixed (a first attempt at this fix got the 403 down to a 404, which is what exposed this). publishConfig.registry (set explicitly below) already fully determines pnpm publish's *target* registry on its own; only the host-scoped auth token below is genuinely needed, added after install so install never sees any @exadev scope mapping at all.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Rewrite package name and registry for the GitHub Packages scope
        # GitHub Packages requires the npm package name to be scoped to the repo owner. Rewriting the fields rather than keeping a second package.json means this alias cannot drift away from the real package's metadata.
        run: |
          npm pkg set name="@exadev/documents.js"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
      - name: Configure the GitHub Packages auth token for publish only
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
      - run: pnpm publish --access public --no-git-checks

  attest:
    name: Attest SBOM and build provenance
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # the release commit semantic-release just pushed
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Pack into a directory of its own, separate from dist/ (tsdown's raw build output). The attestation subject has to be the artefact that actually ships -- attesting dist/ itself would mix in files that never leave the repo, producing digests that match nothing a consumer can download.
      - run: pnpm pack --pack-destination release-artifact
      - run: pnpm sbom --sbom-format spdx --prod > release-artifact/sbom.spdx.json
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: release-artifact/*.tgz
          sbom-path: release-artifact/sbom.spdx.json
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: release-artifact/*.tgz
