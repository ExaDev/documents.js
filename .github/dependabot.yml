version: 2

# GitHub reads only the repository root's dependabot.yml, so the per-package copies this replaces could never have run here. `directories` (plural, glob-capable) covers the workspace root's own manifest plus every package's, in one entry rather than one per manifest.
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: "daily"
    cooldown:
      # Seven days of public availability before Dependabot proposes a third-party update at all, matching the per-package configs. The sibling-package exclusions those configs carried are gone: the packages that needed exempting are workspace members now, resolved from the workspace rather than the registry, so Dependabot has nothing to propose for them.
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # Every package manifest plus the root on one daily schedule would open a flood of individual pull requests, where separate repositories previously spread the same updates out. Minor and patch updates batch into one pull request; a major update still gets its own, since it is the one that needs reading.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The npm entry above never covered the actions themselves, so every `uses:` in ci.yml and dependabot-auto-merge.yml -- checkout, setup-node, pnpm/action-setup, cache, attest, the Pages actions -- was pinned to a major and then left to drift, including the ones that hold `id-token: write` and sign release attestations. `/` covers the workflow files; `/.github/actions/*` covers the composite action's own `uses:` steps, which live in a separate manifest Dependabot does not reach from the root.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      # Weekly rather than the npm entry's daily: action releases are far less frequent, and a daily poll would only add noise.
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      # `ci` rather than the npm entry's `build`: these updates change the CI definition, and commitlint accepts both types. The scope Dependabot appends makes it `ci(deps)`.
      prefix: "ci"
      include: "scope"
    groups:
      # One catch-all group, majors included. Unlike an npm major, an action major bump is a one-line change that either passes CI or does not, so there is nothing gained by isolating it into its own pull request.
      actions:
        patterns: ["*"]
