version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "document-schema.js"
      - dependency-name: "ooxml.js"
      - dependency-name: "odf.js"
      - dependency-name: "pdf-codec"
      - dependency-name: "markdown-codec"
    commit-message:
      prefix: "build"
      include: "scope"
