name: Setup workspace
description: Set up pnpm + Node, install the workspace from the frozen lockfile, restore turbo's local cache, then run a command. Requires checkout before use.

inputs:
  task:
    description: Task identifier, used for the step name and as part of the turbo cache key (lint, typecheck, test, build, release).
    required: true
  command:
    description: Shell command to execute after install.
    required: true
  github-token:
    description: GitHub token for commands that need it (e.g. the release orchestrator).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        # A single source of truth for the whole workspace, rather than a version literal repeated in every job. registry-url is deliberately absent everywhere: setting it makes setup-node write an .npmrc containing an _authToken line, and that line wins over the OIDC token exchange -- so the setting that looks like it configures the registry is exactly the one that would stop trusted publishing working.
        node-version-file: .node-version
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # turbo's local filesystem cache, keyed per task. This is what makes one root job per task cheaper than the per-package workflows it replaces: a package whose inputs are unchanged since the last run on this branch replays its cached result instead of re-running tsdown/tsc/vitest.
    #
    # The key was previously `...-${{ github.sha }}`, which is wrong in both directions. actions/cache treats a key as immutable, so the first run for a commit wrote the cache and every re-run of that same commit found its exact key already present and skipped the save -- meaning a re-run could never repair or extend a cache written by a partially failed run. More importantly the key said nothing about the lockfile or the pipeline definition, so `restore-keys` would happily restore a cache built under a different pnpm-lock.yaml or a different turbo.json into a run whose task graph had changed underneath it.
    #
    # hashFiles puts the lockfile and turbo.json into the key itself, so changing either starts a fresh cache lineage rather than inheriting a stale one; github.run_id keeps every run's key unique, so each run genuinely saves what it computed. The two-level restore-keys then prefers a cache from the same lockfile/turbo.json generation and falls back to the newest cache for the task only when that generation has no entry yet.
    - uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ inputs.task }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.run_id }}
        restore-keys: |
          turbo-${{ inputs.task }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
          turbo-${{ inputs.task }}-${{ runner.os }}-

    - name: Run ${{ inputs.task }}
      run: ${{ inputs.command }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
