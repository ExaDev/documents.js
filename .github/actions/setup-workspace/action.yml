name: Setup workspace
description: Set up pnpm + Node, install the workspace from the frozen lockfile, restore turbo's local cache, then run a command. Requires checkout before use.

inputs:
  task:
    description: Task identifier, used for the step name and as part of the turbo cache key (lint, typecheck, test, build, release).
    required: true
  command:
    description: Shell command to execute after install.
    required: true
  github-token:
    description: GitHub token for commands that need it (e.g. the release orchestrator).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        # A single source of truth for the whole workspace, rather than a version literal repeated in every job. registry-url is deliberately absent everywhere: setting it makes setup-node write an .npmrc containing an _authToken line, and that line wins over the OIDC token exchange — so the setting that looks like it configures the registry is exactly the one that would stop trusted publishing working.
        node-version-file: .tool-versions
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # turbo's local filesystem cache, one per task. This is what makes one root job per task cheaper than the per-package workflows it replaces: a package whose inputs are unchanged since the last run on main replays its cached result instead of re-running tsdown/tsc/vitest.
    #
    # Restored on every run and saved only by a push to main, and only ever one entry per task on main. An entry keyed by github.run_id (the previous design) is written by every run, including every pull request push and every merge-queue entry, and no later run can ever hit that exact key: the cache filled with write-once data, went over the repository's limit, and GitHub's least-recently-used eviction then removed the entries that were being used. A pull request or merge-group entry also belongs to its own ref, so a cache saved there is invisible to everything but reruns of that one ref. So those runs restore what main last saved, through the restore-keys prefix, and save nothing.
    #
    # The key names the commit, which makes it unique per main push: that alone would be the same write-once growth as run_id, so the prune-caches job in ci.yml deletes every older entry for each task on main. What stays bounded is the number of entries (one per task), not the number of runs. The deletion is a separate job because it needs a token that can write to Actions, and a job that runs a merge-queue or pull request ref's code must not hold one. The key still carries the lockfile and turbo.json hash so the restore prefers an entry from the same generation, and the fallback prefix takes the newest entry for the task otherwise.
    - id: turbo-cache
      uses: actions/cache/restore@v6
      with:
        path: .turbo
        key: turbo-${{ inputs.task }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ inputs.task }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
          turbo-${{ inputs.task }}-${{ runner.os }}-

    - name: Run ${{ inputs.task }}
      run: ${{ inputs.command }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Save turbo's cache from main
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: .turbo
        key: turbo-${{ inputs.task }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
