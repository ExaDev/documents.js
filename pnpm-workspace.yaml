minimumReleaseAgeExclude:
  # All versions belong in ONE entry, versions joined by "||" -- pnpm's exclude-policy matcher returns on the first rule whose package name matches, so a second separate entry for the same package name is silently never reached.
  - ooxml.js@2.1.0||2.2.0||2.2.3
  - document-schema.js@1.5.3
  - odf.js@1.8.0||1.9.0||1.10.0||1.10.3
  - pdf-codec@1.0.0||1.1.3
