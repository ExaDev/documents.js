# minimumReleaseAgeExclude is NOT honoured by `pnpm install --frozen-lockfile` (what CI runs) -- only minimumReleaseAge itself gates that path. Set low enough here that a same-day sibling-package release (ooxml.js/document-schema.js/odf.js/pdf-codec) never blocks CI, matching ooxml.js's own existing pnpm-workspace.yaml precedent.
minimumReleaseAge: 60
# Bare package names (no @version), per pnpm's own documented syntax (https://pnpm.io/settings#minimumreleaseageexclude -- "webpack" exempts every version, not just one) -- these four are this org's own sibling packages, published only via their own semantic-release CI with npm OIDC trusted publishing, so a version-agnostic exemption is a deliberate, low-risk carry-forward rather than the version-pinned entries this file used to need updating on every single release.
minimumReleaseAgeExclude:
  - ooxml.js
  - document-schema.js
  - odf.js
  - pdf-codec

# markdown-codec is temporarily consumed via a pinned git commit (package.json's own "markdown-codec": "github:ExaDev/markdown-codec#<sha>" dependency) rather than a published npm version, pending that package's own npm trusted-publisher setup -- a git-hosted dependency needs its own "prepare" script (husky && tsdown --config-loader unrun) to produce dist/, which pnpm refuses to run automatically unless explicitly allowlisted here.
allowBuilds:
  markdown-codec@https://codeload.github.com/ExaDev/markdown-codec/tar.gz/11342229e6e6b7c0a773af199b1d0352611c9c6b: true
