minimumReleaseAgeExclude:
  - ooxml.js@2.1.0||2.2.0
  # All versions belong in ONE entry, versions joined by "||" -- pnpm's exclude-policy matcher returns on the first rule whose package name matches, so a second separate "document-schema.js@x" line for the same package name is silently never reached.
  - document-schema.js@1.5.3
  # Transitive only: odf.js@1.10.0 and pdf-codec@1.0.0 still declare document-content-model (not document-schema.js) as their own dependency at these versions -- not this repo's own direct dependency, which now depends on document-schema.js above.
  - document-content-model@1.3.0||1.5.1
  - odf.js@1.8.0||1.9.0||1.10.0
  - pdf-codec@1.0.0
