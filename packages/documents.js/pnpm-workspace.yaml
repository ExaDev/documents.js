# workerd (the Cloudflare Workers runtime vitest-pool-workers drives the workers tests through) and esbuild (its bundler) both ship native binaries installed via a postinstall script -- pnpm 11 ignores those by default, so allow them explicitly. Preserved alongside this file's existing minimumReleaseAge/minimumReleaseAgeExclude/overrides content, which govern an unrelated concern (supply-chain release-age gating, not native-binary build scripts).
allowBuilds:
  esbuild: true
  workerd: true
# minimumReleaseAgeExclude is NOT honoured by `pnpm install --frozen-lockfile` (what CI runs) -- only minimumReleaseAge itself gates that path. Set low enough here that a same-day sibling-package release (ooxml.js/document-schema.js/odf.js/pdf-codec/markdown-codec) never blocks CI, matching ooxml.js's own existing pnpm-workspace.yaml precedent.
minimumReleaseAge: 60
# Bare package names (no @version), per pnpm's own documented syntax (https://pnpm.io/settings#minimumreleaseageexclude -- "webpack" exempts every version, not just one) -- these six are this org's own sibling packages, published only via their own semantic-release CI with npm OIDC trusted publishing, so a version-agnostic exemption is a deliberate, low-risk carry-forward rather than the version-pinned entries this file used to need updating on every single release.
minimumReleaseAgeExclude:
  - ooxml.js
  - document-schema.js
  - odf.js
  - pdf-codec
  - markdown-codec
  - byte-codec
  - '@exadev/eslint-config'

# fast-uri < 3.1.5 is vulnerable to host confusion via a backslash authority introducer (GHSA-hht2-r2mx-9j9m). It's a transitive devDependency (ajv -> @commitlint/config-validator -> commitlint), several layers below anything this repo declares directly, so there is no direct dependency to bump -- only this override forces every resolution of it onto a patched version regardless of what commitlint's own dependency tree asks for.
overrides:
  fast-uri: ^3.1.5
  js-yaml: ^4.3.1
