version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
        - "document-schema.js"
        - "ooxml.js"
        - "odf.js"
        - "pdf-codec"
        - "markdown-codec"
    commit-message:
      prefix: "build"
      include: "scope"
