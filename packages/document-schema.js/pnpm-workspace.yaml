# fast-uri < 3.1.5 is vulnerable to host confusion via a backslash authority introducer (GHSA-hht2-r2mx-9j9m). It's a transitive devDependency (ajv -> @commitlint/config-validator -> commitlint), several layers below anything this repo declares directly, so there is no direct dependency to bump -- only this override forces every resolution of it onto a patched version regardless of what commitlint's own dependency tree asks for.
overrides:
  fast-uri: ^3.1.5
# workerd (the Cloudflare Workers runtime vitest-pool-workers drives the workers tests through) and esbuild (its bundler) both ship native binaries installed via a postinstall script -- pnpm 11 ignores those by default, so allow them explicitly.
allowBuilds:
  esbuild: true
  workerd: true
# Set low enough that a same-day sibling-package release (@exadev/eslint-config, or the ooxml.js/odf.js/pdf-codec/markdown-codec/documents.js family this package is itself a dependency of) never blocks CI, matching documents.js's own existing pnpm-workspace.yaml precedent.
minimumReleaseAge: 60
# Bare package name (no @version), per pnpm's own documented syntax (https://pnpm.io/settings#minimumreleaseageexclude -- "webpack" exempts every version, not just one) -- @exadev/eslint-config is this org's own sibling package (the four local eslint-rules/*.ts implementations, now shared across this whole repo family), published only via its own semantic-release CI with npm OIDC trusted publishing, so a version-agnostic exemption is a deliberate, low-risk carry-forward rather than an entry this file needs updating on every single release.
minimumReleaseAgeExclude:
  - '@exadev/eslint-config'
