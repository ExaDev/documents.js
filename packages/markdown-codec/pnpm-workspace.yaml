# workerd (the Cloudflare Workers runtime vitest-pool-workers drives the workers tests through) and esbuild (its bundler) both ship native binaries installed via a postinstall script -- pnpm 11 ignores those by default, so allow them explicitly, matching the byte-codec template this repo's own workers test (test/workers/markdown-codec.test.ts) was built against.
allowBuilds:
  esbuild: true
  workerd: true
# minimumReleaseAgeExclude is NOT honoured by `pnpm install --frozen-lockfile` (the mode CI runs) -- only minimumReleaseAge itself gates that path; the entries below are for local `pnpm add`/`pnpm update` convenience only.
minimumReleaseAge: 60
# Bare package names (no @version), per pnpm's own documented syntax (https://pnpm.io/settings#minimumreleaseageexclude -- "webpack" exempts every version, not just one) -- document-schema.js and @exadev/eslint-config are this org's own sibling packages, published only via their own semantic-release CI with npm OIDC trusted publishing, so a version-agnostic exemption is a deliberate, low-risk carry-forward rather than an entry this file needs updating on every single release.
minimumReleaseAgeExclude:
  - document-schema.js
  - '@exadev/eslint-config'
