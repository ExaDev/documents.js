# minimumReleaseAgeExclude is NOT honoured by `pnpm install --frozen-lockfile` (the mode CI runs): pnpm's own "verify an already-resolved lockfile" pass ignores per-package excludes entirely and re-checks every entry's raw publish age against minimumReleaseAge with no exceptions -- confirmed by direct reproduction against pnpm 11.6.0 and 11.18.0 (latest), and matches multiple open upstream reports (pnpm/pnpm#10361, #9997, #10438). `pnpm add <exact-version>` has its own separate, more permissive "explicit informed consent" path that DOES auto-populate this list and proceed -- which is why a local `pnpm add` can succeed while the exact same dependency then fails CI's `--frozen-lockfile` install moments later, even with the version already listed below. minimumReleaseAge itself (which frozen-lockfile verification DOES respect) is the only lever that unblocks CI for a same-day sibling-package release.
minimumReleaseAge: 60
# Bare package name (no @version), per pnpm's own documented syntax (https://pnpm.io/settings#minimumreleaseageexclude -- "webpack" exempts every version, not just one) -- document-schema.js is this org's own sibling package, published only via its own semantic-release CI with npm OIDC trusted publishing, so a version-agnostic exemption is a deliberate, low-risk carry-forward rather than an entry this file needs updating on every single document-schema.js release.
minimumReleaseAgeExclude:
  - document-schema.js
